name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Fork: a tag é resolvida e validada ANTES do checkout. Ela entra por variável de ambiente,
      # nunca interpolada no script — interpolada, uma tag com aspa simples fecha a string e o resto
      # vira comando dentro de um job com contents: write.
      - name: Resolve the tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:INPUT_TAG
          if (-not $tag) { $tag = $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "tag '$tag' is not vMAJOR.MINOR.PATCH" }
          "tag=$tag"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Fork: ações presas ao commit, não à tag móvel — quem dominar o repositório de uma action
      # move a tag e passa a rodar dentro deste build. E o checkout é da TAG, não de uma ref
      # qualquer: o binário publicado como vX.Y.Z tem de ser o do commit dessa tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Verify the checkout is the tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $want = git rev-parse "refs/tags/${env:TAG}^{commit}"
          $have = git rev-parse HEAD
          if (-not $want -or $want -ne $have) { throw "HEAD $have is not the commit of tag $env:TAG ($want)" }
          "building $env:TAG at $have"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6
        with:
          dotnet-version: '9.0.x'

      # Fork: uma suíte por passo. No mesmo passo, o PowerShell termina com o código do ÚLTIMO
      # comando — unitários falhando e E2E passando publicariam a release mesmo assim.
      - name: Unit tests
        run: dotnet test tests/RateTray.Tests/RateTray.Tests.csproj --configuration Release

      - name: End-to-end tests
        run: dotnet test tests/RateTray.E2E/RateTray.E2E.csproj --configuration Release

      # Framework-dependent: a self-contained build would be ~70 MB, and the .NET 9 Desktop
      # Runtime is already present on most machines that run either CLI.
      - name: Publish
        run: >
          dotnet publish src/RateTray/RateTray.csproj
          --configuration Release --runtime win-x64
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Gaugely.exe -Algorithm SHA256).Hash
          "$hash  Gaugely.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii
          # A MIT exige o aviso de licença junto do binário distribuído, não só no código-fonte.
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md publish/THIRD-PARTY-NOTICES.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/Gaugely.exe
            publish/SHA256SUMS.txt
            publish/LICENSE.txt
            publish/THIRD-PARTY-NOTICES.md
          body: |
            Requires the [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0).

            Verify the download:

            ```powershell
            Get-FileHash Gaugely.exe -Algorithm SHA256
            ```
