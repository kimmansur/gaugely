name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # WinForms and GDI+ throughout — this cannot build or run on Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore RateTray.sln

      - name: Build
        run: dotnet build RateTray.sln --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/RateTray.Tests/RateTray.Tests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # The e2e suite skips the tests that need a desktop session or live CLI sign-ins, so on a
      # hosted runner it verifies little more than that the binary launches. Kept in CI anyway:
      # it catches a harness that no longer finds or starts the app at all.
      - name: End-to-end tests
        run: >
          dotnet test tests/RateTray.E2E/RateTray.E2E.csproj
          --configuration Release --no-build --logger "trx;LogFileName=e2e.trx"
          --results-directory TestResults

      - name: Publish single file
        run: >
          dotnet publish src/RateTray/RateTray.csproj
          --configuration Release --runtime win-x64 --output publish

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: RateTray
          path: publish/Gaugely.exe
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
